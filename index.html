<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Firebase Chat App</title>

  <script src="https://www.gstatic.com/firebasejs/6.6.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/6.6.1/firebase-database.js"></script>

  <script>
    var firebaseConfig = {
      apiKey: "AIzaSyDlFQmbshbz32CxUn8mFHfGm7opw5UhUZg",
      authDomain: "tinkering-6f440.firebaseapp.com",
      databaseURL: "https://tinkering-6f440.firebaseio.com",
      projectId: "tinkering-6f440",
      storageBucket: "tinkering-6f440.appspot.com",
      messagingSenderId: "966393702974",
      appId: "tinkering-6f440"

    firebase.initializeApp(firebaseConfig);

  <link rel="stylesheet" href="css/normalize.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Open+Sans">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/malihu-custom-scrollbar-plugin/3.1.3/jquery.mCustomScrollbar.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <div class="chat">

    <div class="chat-title">
      <h1>Chat Room</h1>
      <h2>Firebase + Vanilla JavaScript</h2>

      <figure class="avatar">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQpdX6tPX96Zk00S47LcCYAdoFK8INeCElPeJrVDrh8phAGqUZP_g" alt="Avatar">
      </figure>
    </div>

    <div class="messages">
      <div class="messages-content"></div>
    </div>

    <div class="message-box">
      <textarea
        class="message-input"
        id="message"
        placeholder="Type message..."
        autocomplete="off"
        spellcheck="false"
      ></textarea>

      <button type="button" class="message-submit">
        Send
      </button>
    </div>

  </div>

  <div class="bg"></div>

  <script src="js/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/malihu-custom-scrollbar-plugin/3.1.3/jquery.mCustomScrollbar.concat.min.js"></script>
  <script src="js/index.js"></script>

</body>
</html>
