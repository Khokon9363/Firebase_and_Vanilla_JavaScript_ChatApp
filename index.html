<html lang="en">
<head>

    <title>Firebase Chat</title>

    <script src="https://www.gstatic.com/firebasejs/6.6.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/6.6.1/firebase-database.js"></script>

    <script>

            apiKey: "AIzaSyDlFQmbshbz32CxUn8mFHfGm7opw5UhUZg",
            authDomain: "tinkering-6f440.firebaseapp.com",
            databaseURL: "https://tinkering-6f440.firebaseio.com",

    <link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Open+Sans">
    <link rel="stylesheet" href="css/style.css">

<body>

    <div class="chat">

        <div class="chat-title">
            <h1>Hridoy's Chat Room</h1>
            <h2>Firebase + Vanilla JavaScript</h2>

            <figure class="avatar">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQpdX6tPX96Zk00S47LcCYAdoFK8INeCElPeJrVDrh8phAGqUZP_g">
            </figure>
        </div>

        <div class="messages" id="messages">
            <div class="messages-content" id="messagesContent"></div>
        </div>

        <div class="message-box">

            <textarea
                class="message-input"
                id="message"
                placeholder="Type message..."
                autocomplete="off"
            ></textarea>

            <button
                type="button"
                class="message-submit"
                id="sendButton"
            >
                Send
            </button>

        </div>

    </div>

    <div class="bg"></div>

    <script src="js/index.js"></script>

</body>
